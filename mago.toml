extends = "vendor/webware/webware-tools/mago.toml"
php-version = "8.4.1"

[linter]
baseline = "lint-baseline.toml"

[analyzer]
baseline = "analysis-baseline.toml"

[source]
paths = ["src", "test"]
includes = ["vendor"]
# Byte-compared fixtures: the writer tests assert the exact text the writer emits, so the
# formatter must not normalise these files.
excludes = ["test/unit/Writer/_files/array.php"]